[project]
name = "kavach-agents"
version = "0.1.0"
description = "Kavach agent service (NeMo Agent Toolkit + Nemotron via NIM)"
authors = [
    { name = "Chidatma-C", email = "chidatma.chaganti@mftlabs.io" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx[http2]>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain-core>=1.7.6",
    "nemoguardrails>=0.24.1",
    "nvidia-nat>=1.9.0",
    "openai>=3.46.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs SpacetimeDB kavach-agents and the running service"]
